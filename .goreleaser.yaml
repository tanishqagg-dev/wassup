version: 2
project_name: wassup

builds:
  - main: ./cmd/wassup
    binary: wassup
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/tanishqagg-dev/wassup/internal/engine.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*.md, skills/**/*]

release:
  github:
    owner: tanishqagg-dev
    name: wassup

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over the checksum file (verifiable with cosign verify-blob).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# One SBOM per archive (needs syft in CI).
sboms:
  - artifacts: archive

homebrew_casks:
  - name: wassup
    binaries: [wassup]
    homepage: https://github.com/tanishqagg-dev/wassup
    description: WhatsApp from your terminal and your AI apps
    repository:
      owner: tanishqagg-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Without a tap token in CI, the cask is published separately (see docs/releasing.md).
    skip_upload: "{{ if not .Env.HOMEBREW_TAP_TOKEN }}true{{ end }}"
    # The plain CLI binaries in these archives aren't notarized; drop the quarantine bit so macOS runs them.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/wassup"]
          end

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
